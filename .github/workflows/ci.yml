name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  # Re-run against the merge queue's combined branch before it lands (no-op
  # until a merge queue is configured on the branch).
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      frontend: ${{ steps.filter.outputs.frontend }}
      all: ${{ steps.filter.outputs.all == 'true' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            contract:
              - 'contract-rs/**'
            frontend:
              - 'frontend/**'
            all:
              - '.github/workflows/**'

  contract:
    name: Contract checks
    needs: changes
    if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract-rs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install --assume-yes libudev-dev
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contract-rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The sandbox integration test builds the wasm through the cargo-near binary.
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo test

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # Single required status check. Succeeds if every needed job either passed or
  # was skipped (path-filtered out); fails if any failed or was cancelled. Make
  # THIS the required check in branch protection — not the individual jobs — so
  # docs-only PRs (all jobs skipped) still pass. The skill fills `needs` with the
  # job names generated above (plus a `changes` filter job on multi-package repos).
  ci-passed:
    needs: [changes, contract, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
